name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: vig, POSTGRES_PASSWORD: vig, POSTGRES_DB: vig }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vig" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - name: gofmt
        working-directory: backend
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi
      - name: Vet and test
        working-directory: backend
        env: { RATE_LIMIT_DISABLED: "1" }
        run: go vet ./... && go test ./...
      - name: Migrations apply cleanly
        working-directory: backend
        env: { DATABASE_URL: "postgres://vig:vig@localhost:5432/vig?sslmode=disable" }
        run: go run ./cmd/vig migrate up && go run ./cmd/vig migrate status
      - name: Spec is committed and current
        working-directory: backend
        run: go run ./cmd/vig openapi > /tmp/openapi.json && diff -u openapi.json /tmp/openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - name: Generated client matches the committed spec
        working-directory: frontend
        run: npm run gen && git diff --exit-code src/api/generated
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test --if-present
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env: { SITE_URL: "https://vig.example" }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: vig:ci
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image answers
        run: docker run --rm vig:ci openapi | head -c 200 | grep -q '"openapi"'
