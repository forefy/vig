apiVersion: v1
kind: Service
metadata:
  name: {{ include "vig.fullname" . }}
  labels:
    {{- include "vig.labels" . | nindent 4 }}
spec:
  type: {{ if eq .Values.ingress.mode "loadbalancer" }}LoadBalancer{{ else }}{{ .Values.service.type }}{{ end }}
  selector:
    {{- include "vig.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
