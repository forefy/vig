{{- if .Values.imagePullSecret.create -}}
{{/* A docker-registry pull secret from a read-only GHCR token. */}}
{{- $reg := .Values.imagePullSecret.registry -}}
{{- $user := required "imagePullSecret.username is required when imagePullSecret.create=true" .Values.imagePullSecret.username -}}
{{- $pass := required "imagePullSecret.password is required when imagePullSecret.create=true" .Values.imagePullSecret.password -}}
{{- $auth := printf "%s:%s" $user $pass | b64enc -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vig.fullname" . }}-regcred
  labels:
    {{- include "vig.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"%s\",\"password\":\"%s\",\"auth\":\"%s\"}}}" $reg $user $pass $auth | b64enc }}
{{- end }}
