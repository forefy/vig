{{- if eq .Values.ingress.mode "hostport" -}}
{{- $fullName := include "vig.fullname" . -}}
{{- $tlsSecret := .Values.ingress.tls.secretName | default (printf "%s-tls" $fullName) -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "vig.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.certManagerClusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.certManagerClusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ required "ingress.host is required in hostport mode" .Values.ingress.host | quote }}
      secretName: {{ $tlsSecret }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required in hostport mode" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: http
{{- if .Values.ingress.adminAllowlist }}
---
{{/*
Edge IP gate for the admin API: a Traefik ipAllowList Middleware and a second Ingress covering
only ingress.adminPaths. Traefik routes by rule specificity, so the longer PathPrefix wins.
The operator API (/v1/op) is job-scoped and reachable from sandboxes anywhere, so it is not gated.
*/}}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-admin-allow
  labels:
    {{- include "vig.labels" . | nindent 4 }}
spec:
  ipAllowList:
    sourceRange:
      {{- range .Values.ingress.adminAllowlist }}
      - {{ . | quote }}
      {{- end }}
    {{- with .Values.ingress.adminAllowlistExcludedIPs }}
    ipStrategy:
      excludedIPs:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}-admin
  labels:
    {{- include "vig.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ $fullName }}-admin-allow@kubernetescrd
    {{- if and .Values.ingress.tls.enabled .Values.ingress.tls.certManagerClusterIssuer }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.certManagerClusterIssuer | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ $tlsSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range .Values.ingress.adminPaths }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $fullName }}
                port:
                  name: http
          {{- end }}
{{- end }}
{{- end }}
