{{- if eq .Values.secrets.mode "create" -}}
{{/*
Chart-managed Secret. Every secret the binary reads lands here; the Deployment and the migration
Job pull keys via secretKeyRef. The Postgres password is generated once (reused via lookup) and
both the DSN and the StatefulSet reference this single source.
*/}}
{{- $pw := .Values.postgres.auth.password | default (include "vig.postgresPassword" .) -}}
{{- $dbUrl := .Values.secrets.databaseUrl -}}
{{- if .Values.postgres.internal -}}
{{- $dbUrl = printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgres.auth.username $pw (include "vig.postgresFullname" .) .Values.postgres.auth.database -}}
{{- else -}}
{{- $dbUrl = required "secrets.databaseUrl is required when postgres.internal=false and secrets.mode=create" .Values.secrets.databaseUrl -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vig.fullname" . }}-secrets
  labels:
    {{- include "vig.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-secret: {{ required "secrets.sessionSecret is required" .Values.secrets.sessionSecret | quote }}
  database-url: {{ $dbUrl | quote }}
  {{- if .Values.postgres.internal }}
  postgres-password: {{ $pw | quote }}
  {{- end }}
  google-client-id: {{ .Values.secrets.googleClientId | quote }}
  google-client-secret: {{ .Values.secrets.googleClientSecret | quote }}
  github-oauth-client-id: {{ .Values.secrets.githubOauthClientId | quote }}
  github-oauth-client-secret: {{ .Values.secrets.githubOauthClientSecret | quote }}
  github-app-id: {{ .Values.secrets.githubAppId | quote }}
  github-app-private-key: {{ .Values.secrets.githubAppPrivateKey | quote }}
  github-app-webhook-secret: {{ .Values.secrets.githubAppWebhookSecret | quote }}
  discord-client-id: {{ .Values.secrets.discordClientId | quote }}
  discord-client-secret: {{ .Values.secrets.discordClientSecret | quote }}
  discord-bot-token: {{ .Values.secrets.discordBotToken | quote }}
  github-token: {{ .Values.secrets.githubToken | quote }}
  rpc-primary-url: {{ .Values.secrets.rpcPrimaryUrl | quote }}
  smtp-pass: {{ .Values.secrets.smtpPass | quote }}
{{- end }}
