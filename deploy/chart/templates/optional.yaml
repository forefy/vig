{{/* Optional security/observability plane. Everything here is OFF by default. */}}
{{- if .Values.optional.podDisruptionBudget }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vig.fullname" . }}
  labels:
    {{- include "vig.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "vig.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
{{- if .Values.optional.networkPolicy }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vig.fullname" . }}
  labels:
    {{- include "vig.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vig.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.optional.networkPolicyIngressNamespace | quote }}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
    - from:
        - podSelector: {}
      ports:
        - port: {{ .Values.service.port }}
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
    # GitHub, OAuth providers, Solana RPC, osec, Discord, SMTP.
    - ports:
        - port: 443
          protocol: TCP
        - port: 587
          protocol: TCP
{{- end }}
{{- if .Values.optional.serviceMonitor }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "vig.fullname" . }}
  labels:
    {{- include "vig.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "vig.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
