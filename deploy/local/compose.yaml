services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vig
      POSTGRES_PASSWORD: vig
      POSTGRES_DB: vig
    ports:
      - "7132:5432"
    volumes:
      - vig-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vig"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  vig-pg:
