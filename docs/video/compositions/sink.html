    (() => {
      const tl = gsap.timeline({ paused: true });
      const F = 1 / 30;
      const print = (sel, at, gap, head) => {
        const lines = document.querySelectorAll(sel + " .ln");
        lines.forEach((el, i) => {
          if (i < (head || 0)) tl.set(el, { opacity: 1 }, 0);
          else tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 2 * F, ease: "none" }, at + (i - (head || 0)) * gap);
        });
      };
      const title = (id, at, out) => {
        tl.set("#" + id, { opacity: 1 }, at);
        const words = document.querySelectorAll("#" + id + " .w");
        words.forEach((w, i) => tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, at + i * 0.067));
        tl.to("#" + id, { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power3.in" }, out);
      };

      // Hook: the three documents print.
      print("#p-op", 0.05, 2 * F, 3);
      print("#p-ag", 0.2, 2 * F, 2);
      print("#p-fz", 0.35, 2 * F, 2);
      title("t1", 1.2, 3.4);

      // Tension: the documents go to one door.
      tl.to("#p-op", { x: 638, y: 80, scale: 0.18, opacity: 0, filter: "blur(4px)", duration: 0.7, ease: "power2.inOut" }, 3.6);
      tl.to("#p-ag", { x: -568, y: 275, scale: 0.18, opacity: 0, filter: "blur(4px)", duration: 0.7, ease: "power2.inOut" }, 3.64);
      tl.to("#p-fz", { x: -568, y: -115, scale: 0.18, opacity: 0, filter: "blur(4px)", duration: 0.7, ease: "power2.inOut" }, 3.68);
      tl.fromTo("#door", { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.2)" }, 4.05);
      print("#check", 4.7, 3 * F);
      title("t2", 4.9, 8.1);

      // Reveal: the shape.
      tl.to("#check", { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power3.in" }, 8.9);
      tl.set("#shape", { opacity: 1 }, 9.1);
      document.querySelectorAll("#shape .box").forEach((b, i) => tl.fromTo(b, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, 9.15 + i * 0.2));
      document.querySelectorAll("#shape .arrow").forEach((a, i) => tl.fromTo(a, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 9.25 + i * 0.2));
      document.querySelectorAll("#shape .req span").forEach((s, i) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 2 * F, ease: "none" }, 9.9 + i * 0.05));
      tl.fromTo("#pin", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.25, ease: "power2.out" }, 10.4);
      title("t3", 10.0, 12.3);

      // The door becomes the world.
      tl.to("#door", { scale: 6, opacity: 0, duration: 0.55, ease: "power3.in" }, 12.45);

      window.__timelines = window.__timelines || {};
      window.__timelines["sink"] = tl;
    })();
